# Docker Compose for local development
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: workspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_PG_USER:-soma}
      POSTGRES_PASSWORD: ${APP_PG_PASSWORD:-soma}
      POSTGRES_DB: ${APP_PG_DB:-workspace_agent}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_PG_USER:-soma}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: workspace-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  redis_data:
